name: Odśwież półkę

on:
  schedule:
    - cron: '17 1 * * *'   # codziennie ok. 2:17 w Polsce (cron w UTC)
  workflow_dispatch:        # przycisk "Run workflow" do ręcznego uruchomienia
  push:
    branches: [main]
    paths: ['site/index.html', 'harvester/**', '.github/workflows/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true   # nowy przebieg anuluje stary, nie czekają w kolejce

jobs:
  # Filmy i muzyka pobierają się równolegle, każde w swoim zadaniu.
  films:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pobierz filmy z katalogu Biblioteki Raczyńskich
        run: RTYPE=videos node harvester/harvest.mjs > films-raw.json

      - name: Przywróć cache okładek
        uses: actions/cache@v4
        with:
          path: tmdb-cache.json
          key: tmdb-${{ github.run_id }}
          restore-keys: tmdb-

      - name: Dociągnij okładki filmów z TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node harvester/enrich-tmdb.mjs films-raw.json tmdb-cache.json > films.json

      - uses: actions/upload-artifact@v4
        with:
          name: films
          path: films.json
          retention-days: 3

  music:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pobierz muzykę z katalogu Biblioteki Raczyńskich
        run: RTYPE=audios node harvester/harvest.mjs > music.json

      - uses: actions/upload-artifact@v4
        with:
          name: music
          path: music.json
          retention-days: 3

  build:
    needs: [films, music]
    # strona publikuje się nawet wtedy, gdy pobieranie muzyki się nie uda
    if: ${{ !cancelled() && needs.films.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: films
          path: site

      - uses: actions/download-artifact@v4
        if: ${{ needs.music.result == 'success' }}
        with:
          name: music
          path: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
