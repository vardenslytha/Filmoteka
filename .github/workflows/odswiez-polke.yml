name: Odśwież półkę

# Każdy przebieg pobiera porcję katalogu (do ok. 45 min), zapisuje postęp i publikuje stronę.
# Następny przebieg wznawia od miejsca, w którym skończył poprzedni. Po pełnym cyklu
# przez ok. 20 h przebiegi kończą się od razu, bez zapytań do katalogu.

on:
  schedule:
    - cron: '17 * * * *'     # co godzinę (cron w UTC)
  workflow_dispatch:          # przycisk "Run workflow" do ręcznego uruchomienia
  push:
    branches: [main]
    paths: ['site/index.html', 'harvester/**', '.github/workflows/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # nie przerywamy trwającego pobierania; nowy przebieg poczeka

jobs:
  films:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      state: ${{ steps.harvest.outputs.state }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Przywróć postęp z poprzedniego przebiegu
        uses: actions/cache/restore@v4
        with:
          path: films-checkpoint.json
          key: films-ckpt-${{ github.run_id }}
          restore-keys: films-ckpt-

      - name: Pobierz opublikowane dane jako podstawę
        run: |
          SITE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          curl -fsSL "$SITE_URL/films.json" -o films-base.json || rm -f films-base.json

      - name: Pobierz filmy z katalogu (porcja)
        id: harvest
        continue-on-error: true
        env:
          RTYPE: videos
          CHECKPOINT: films-checkpoint.json
          OUT: films-raw.json
          BASE: films-base.json
          MAX_MINUTES: '45'
        run: node harvester/harvest.mjs

      - name: Zapisz postęp
        if: ${{ always() && hashFiles('films-checkpoint.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: films-checkpoint.json
          key: films-ckpt-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Przywróć cache okładek
        if: ${{ steps.harvest.outputs.state == 'complete' || steps.harvest.outputs.state == 'partial' }}
        uses: actions/cache/restore@v4
        with:
          path: tmdb-cache.json
          key: tmdb-${{ github.run_id }}
          restore-keys: tmdb-

      - name: Dociągnij okładki filmów z TMDB
        if: ${{ steps.harvest.outputs.state == 'complete' || steps.harvest.outputs.state == 'partial' }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node harvester/enrich-tmdb.mjs films-raw.json tmdb-cache.json > films.json

      - name: Zapisz cache okładek
        if: ${{ always() && hashFiles('tmdb-cache.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: tmdb-cache.json
          key: tmdb-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@v4
        if: ${{ steps.harvest.outputs.state == 'complete' || steps.harvest.outputs.state == 'partial' }}
        with:
          name: films
          path: films.json
          retention-days: 3

  music:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      state: ${{ steps.harvest.outputs.state }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Przywróć postęp z poprzedniego przebiegu
        uses: actions/cache/restore@v4
        with:
          path: music-checkpoint.json
          key: music-ckpt-${{ github.run_id }}
          restore-keys: music-ckpt-

      - name: Pobierz opublikowane dane jako podstawę
        run: |
          SITE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          curl -fsSL "$SITE_URL/music.json" -o music-base.json || rm -f music-base.json

      - name: Pobierz muzykę z katalogu (porcja)
        id: harvest
        continue-on-error: true
        env:
          RTYPE: audios
          CHECKPOINT: music-checkpoint.json
          OUT: music.json
          BASE: music-base.json
          MAX_MINUTES: '45'
        run: node harvester/harvest.mjs

      - name: Zapisz postęp
        if: ${{ always() && hashFiles('music-checkpoint.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: music-checkpoint.json
          key: music-ckpt-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@v4
        if: ${{ steps.harvest.outputs.state == 'complete' || steps.harvest.outputs.state == 'partial' }}
        with:
          name: music
          path: music.json
          retention-days: 3

  build:
    needs: [films, music]
    # publikujemy, gdy którekolwiek zadanie przyniosło nowe dane (pełne albo porcję)
    if: >-
      ${{ !cancelled() && (
        needs.films.outputs.state == 'complete' || needs.films.outputs.state == 'partial' ||
        needs.music.outputs.state == 'complete' || needs.music.outputs.state == 'partial') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zachowaj obecnie opublikowane dane
        run: |
          SITE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          curl -fsSL "$SITE_URL/films.json" -o site/films.json.cur && mv site/films.json.cur site/films.json || rm -f site/films.json.cur
          curl -fsSL "$SITE_URL/music.json" -o site/music.json || rm -f site/music.json

      - uses: actions/download-artifact@v4
        if: ${{ needs.films.outputs.state == 'complete' || needs.films.outputs.state == 'partial' }}
        with:
          name: films
          path: site

      - uses: actions/download-artifact@v4
        if: ${{ needs.music.outputs.state == 'complete' || needs.music.outputs.state == 'partial' }}
        with:
          name: music
          path: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
