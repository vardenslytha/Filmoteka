name: Odśwież półkę

# v9. Każdy przebieg pobiera porcję katalogu (do ok. 45 min), zapisuje postęp i publikuje stronę.
# Następny przebieg wznawia od miejsca, w którym skończył poprzedni. Po pełnym cyklu
# przez ok. 20 h katalog nie jest odpytywany; w tym czasie zadanie muzyki dociąga okładki z MusicBrainz.
# Podsumowanie każdego przebiegu jest na stronie przebiegu (zakładka Summary).

on:
  schedule:
    - cron: '17 * * * *'     # co godzinę (cron w UTC)
  workflow_dispatch:          # przycisk "Run workflow" do ręcznego uruchomienia
  push:
    branches: [main]
    paths: ['site/index.html', 'harvester/**', '.github/workflows/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # nie przerywamy trwającego pobierania; nowy przebieg poczeka

jobs:
  films:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      state: ${{ steps.harvest.outputs.state }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Przywróć postęp z poprzedniego przebiegu
        uses: actions/cache/restore@v4
        with:
          path: films-checkpoint.json
          key: films-ckpt-${{ github.run_id }}
          restore-keys: films-ckpt-

      - name: Pobierz opublikowane dane jako podstawę
        run: |
          SITE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          curl -fsSL "$SITE_URL/films.json" -o films-base.json || rm -f films-base.json

      - name: Pobierz filmy z katalogu (porcja)
        id: harvest
        continue-on-error: true
        env:
          RTYPE: videos
          CHECKPOINT: films-checkpoint.json
          OUT: films-raw.json
          BASE: films-base.json
          MAX_MINUTES: '45'
        run: node harvester/harvest.mjs

      - name: Zapisz postęp
        if: ${{ always() && hashFiles('films-checkpoint.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: films-checkpoint.json
          key: films-ckpt-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Przywróć cache okładek
        if: ${{ steps.harvest.outputs.state == 'complete' || steps.harvest.outputs.state == 'partial' }}
        uses: actions/cache/restore@v4
        with:
          path: tmdb-cache.json
          key: tmdb-${{ github.run_id }}
          restore-keys: tmdb-

      - name: Dociągnij okładki filmów z TMDB
        if: ${{ steps.harvest.outputs.state == 'complete' || steps.harvest.outputs.state == 'partial' }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node harvester/enrich-tmdb.mjs films-raw.json tmdb-cache.json > films.json

      - name: Zapisz cache okładek
        if: ${{ always() && hashFiles('tmdb-cache.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: tmdb-cache.json
          key: tmdb-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@v4
        if: ${{ steps.harvest.outputs.state == 'complete' || steps.harvest.outputs.state == 'partial' }}
        with:
          name: films
          path: films.json
          retention-days: 3

  music:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      state: ${{ steps.harvest.outputs.state }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Przywróć postęp z poprzedniego przebiegu
        uses: actions/cache/restore@v4
        with:
          path: music-checkpoint.json
          key: music-ckpt-${{ github.run_id }}
          restore-keys: music-ckpt-

      - name: Pobierz opublikowane dane jako podstawę
        run: |
          SITE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          curl -fsSL "$SITE_URL/music.json" -o music-base.json || rm -f music-base.json

      - name: Pobierz muzykę z katalogu (porcja)
        id: harvest
        continue-on-error: true
        env:
          RTYPE: audios
          CHECKPOINT: music-checkpoint.json
          OUT: music-raw.json
          BASE: music-base.json
          MAX_MINUTES: '45'
        run: node harvester/harvest.mjs

      - name: Zapisz postęp
        if: ${{ always() && hashFiles('music-checkpoint.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: music-checkpoint.json
          key: music-ckpt-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Przywróć cache okładek płyt
        if: ${{ steps.harvest.outputs.state == 'complete' || steps.harvest.outputs.state == 'partial' || steps.harvest.outputs.state == 'fresh' }}
        uses: actions/cache/restore@v4
        with:
          path: mb-cache.json
          key: mb-${{ github.run_id }}
          restore-keys: mb-

      # Po pobraniu katalogu: krótka porcja okładek (15 min). Gdy katalog jest świeży: długa (50 min) na opublikowanych danych.
      - name: Dociągnij okładki płyt z MusicBrainz
        id: covers
        if: ${{ steps.harvest.outputs.state == 'complete' || steps.harvest.outputs.state == 'partial' || steps.harvest.outputs.state == 'fresh' }}
        continue-on-error: true
        env:
          STATE: ${{ steps.harvest.outputs.state }}
          MB_MINUTES: ${{ steps.harvest.outputs.state == 'fresh' && '50' || '15' }}
        run: |
          IN=music-raw.json
          [ "$STATE" = fresh ] && IN=music-base.json
          if [ ! -f "$IN" ]; then echo "Brak danych wejściowych ($IN)."; exit 0; fi
          node harvester/enrich-music.mjs "$IN" mb-cache.json > music.json || cp "$IN" music.json

      - name: Zapisz cache okładek płyt
        if: ${{ always() && hashFiles('mb-cache.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: mb-cache.json
          key: mb-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Czy publikować muzykę
        id: decide
        env:
          STATE: ${{ steps.harvest.outputs.state }}
          CHANGED: ${{ steps.covers.outputs.changed }}
        run: |
          P=false
          if [ "$STATE" = complete ] || [ "$STATE" = partial ]; then P=true; fi
          if [ "$STATE" = fresh ] && [ "$CHANGED" = true ]; then P=true; fi
          # gdyby krok okładek padł przed zapisaniem wyniku, publikujemy surowe dane
          if [ "$P" = true ] && [ ! -s music.json ] && [ -f music-raw.json ]; then cp music-raw.json music.json; fi
          if [ ! -s music.json ]; then P=false; fi
          echo "publish=$P" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: ${{ steps.decide.outputs.publish == 'true' }}
        with:
          name: music
          path: music.json
          retention-days: 3

  build:
    needs: [films, music]
    # publikujemy, gdy którekolwiek zadanie przyniosło nowe dane (pełne, porcję albo nowe okładki płyt),
    # a po wrzuceniu zmian do repo zawsze, żeby nowa wersja strony weszła od razu
    if: >-
      ${{ !cancelled() && (
        github.event_name == 'push' ||
        needs.films.outputs.state == 'complete' || needs.films.outputs.state == 'partial' ||
        needs.music.outputs.publish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zachowaj obecnie opublikowane dane
        run: |
          SITE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          curl -fsSL "$SITE_URL/films.json" -o site/films.json.cur && mv site/films.json.cur site/films.json || rm -f site/films.json.cur
          curl -fsSL "$SITE_URL/music.json" -o site/music.json || rm -f site/music.json

      - uses: actions/download-artifact@v4
        if: ${{ needs.films.outputs.state == 'complete' || needs.films.outputs.state == 'partial' }}
        with:
          name: films
          path: site

      - uses: actions/download-artifact@v4
        if: ${{ needs.music.outputs.publish == 'true' }}
        with:
          name: music
          path: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Cykl w toku: od razu zamawiamy następny przebieg, zamiast czekać na harmonogram
  # (GitHub potrafi opóźniać albo pomijać uruchomienia z crona). Przy błędzie łańcuch się zatrzymuje,
  # a harmonogram co godzinę zostaje jako zapas.
  next:
    needs: [films, music]
    if: ${{ !cancelled() && (needs.films.outputs.state == 'partial' || needs.music.outputs.state == 'partial') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Zamów kolejną porcję
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run odswiez-polke.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
